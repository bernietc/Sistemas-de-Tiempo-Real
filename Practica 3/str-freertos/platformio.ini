; Banco de pruebas STR - ATmega328P + FreeRTOS
; La biblioteca FreeRTOS está copiada en lib/FreeRTOS para poder editar
; su FreeRTOSConfig.h (consigna del Entorno de Trabajo Común).

[env:ATmega328P]
platform = atmelavr
board = ATmega328P
framework = arduino
board_build.f_cpu = 16000000L   ; en Proteus: Clock Frequency = 16MHz
monitor_speed = 9600
